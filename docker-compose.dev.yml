services:

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runner
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: django-builder
    restart: unless-stopped

  db:
        image: postgres
        restart: unless-stopped
